name: Bridge

on:
  push:
    branches: [main]
    paths:
      - "bridge/**"
      - "protocol/**"
      - ".github/workflows/bridge-ci.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: bridge-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Bridge Build & Test
    # Pinned toolchain and dependency baselines are recorded in bridge/README.md.
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      # Single source of truth for the pinned vcpkg tooling commit -- referenced by both the
      # checkout step and the tooling cache key below so they can never drift apart.
      VCPKG_BASELINE_COMMIT: 2f1d605400c8727cc00c15797aba796c88ccd523
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set VCPKG_DEFAULT_BINARY_CACHE
        # A job-level env: value cannot use the runner context (it is not resolved until a runner
        # picks up the job's steps), so this is computed in a step instead.
        run: echo "VCPKG_DEFAULT_BINARY_CACHE=$env:RUNNER_TEMP\vcpkg-binary-cache" >> $env:GITHUB_ENV

      - name: Prepare vcpkg binary cache
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\vcpkg-binary-cache" | Out-Null

      - name: Set X_VCPKG_REGISTRIES_CACHE
        run: echo "X_VCPKG_REGISTRIES_CACHE=$env:RUNNER_TEMP\vcpkg-registries-cache" >> $env:GITHUB_ENV

      - name: Prepare vcpkg registries cache
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\vcpkg-registries-cache" | Out-Null

      - name: Install pinned CMake
        # windows-2022 ships an older CMake than the pinned version; a direct download of the
        # official release archive is faster and no less trustworthy than a Chocolatey install.
        run: |
          $cmakeVersion = "4.4.2"
          $cmakeArchive = "cmake-$cmakeVersion-windows-x86_64.zip"
          $cmakeArchiveSha256 = "e8139d85b3813bc38833142ae1940472e9a587e9b5d2718ac1804c60f4e57a64"
          $cmakeBin = "$env:RUNNER_TEMP\cmake\cmake-$cmakeVersion-windows-x86_64\bin"
          Invoke-WebRequest -Uri "https://github.com/Kitware/CMake/releases/download/v$cmakeVersion/$cmakeArchive" -OutFile "$env:RUNNER_TEMP\$cmakeArchive"
          $actualSha256 = (Get-FileHash -Path "$env:RUNNER_TEMP\$cmakeArchive" -Algorithm SHA256).Hash
          if ($actualSha256 -ne $cmakeArchiveSha256) {
            throw "CMake archive hash mismatch: expected $cmakeArchiveSha256, got $actualSha256."
          }
          Expand-Archive -Path "$env:RUNNER_TEMP\$cmakeArchive" -DestinationPath "$env:RUNNER_TEMP\cmake" -Force
          $cmakeBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path = "$cmakeBin;$env:Path"
          cmake --version

      - name: Verify pinned Ninja is preinstalled
        # windows-2022 ships exactly the pinned Ninja version already, so nothing installs it;
        # this guards that assumption instead of silently building against a different version.
        run: |
          $ninjaVersion = (ninja --version).Trim()
          if ($ninjaVersion -ne "1.13.2") {
            throw "Expected the windows-2022 image to ship Ninja 1.13.2, but found '$ninjaVersion'."
          }

      - name: Set up the MSVC 2022 developer environment
        # Maintained stable release; no stable Node 24 replacement is available yet.
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Restore cached vcpkg tooling
        id: vcpkg-tooling-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}\vcpkg
          key: ${{ runner.os }}-vcpkg-tooling-${{ env.VCPKG_BASELINE_COMMIT }}

      - name: Check out vcpkg at the pinned builtin baseline
        if: steps.vcpkg-tooling-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/microsoft/vcpkg.git "${{ runner.temp }}\vcpkg"
          git -C "${{ runner.temp }}\vcpkg" checkout $env:VCPKG_BASELINE_COMMIT
          & "${{ runner.temp }}\vcpkg\bootstrap-vcpkg.bat" -disableMetrics

      - name: Restore vcpkg binary cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: ${{ runner.os }}-vcpkg-${{ env.VCPKG_BASELINE_COMMIT }}-${{ hashFiles('bridge/vcpkg.json', 'bridge/vcpkg-configuration.json') }}

      - name: Restore vcpkg registries cache
        # The colorglass registry (bridge/vcpkg-configuration.json) is pinned to an immutable
        # commit; caching its checkout avoids re-fetching it from GitLab on every run, which is
        # what caused repeated HTTP 403s from GitLab's abuse detection on shared CI IPs. A cache
        # miss still fetches it normally during Configure -- this is a cache, not a mirror. Keyed
        # off the config file's hash (not a hand-copied commit literal) so a baseline bump can
        # never drift out of sync with this key the way a duplicated literal could.
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}\vcpkg-registries-cache
          key: ${{ runner.os }}-vcpkg-registries-${{ hashFiles('bridge/vcpkg-configuration.json') }}

      - name: Configure Debug
        working-directory: bridge
        env:
          VCPKG_ROOT: ${{ runner.temp }}\vcpkg
        run: cmake --preset windows-x64-debug

      - name: Build Debug
        working-directory: bridge
        run: cmake --build --preset windows-x64-debug

      - name: Test Debug
        working-directory: bridge
        run: ctest --preset windows-x64-debug

      - name: Configure Release
        working-directory: bridge
        env:
          VCPKG_ROOT: ${{ runner.temp }}\vcpkg
        run: cmake --preset windows-x64-release

      - name: Build Release
        working-directory: bridge
        run: cmake --build --preset windows-x64-release

      - name: Test Release
        working-directory: bridge
        run: ctest --test-dir build/windows-x64-release --output-on-failure

      - name: Upload bridge test diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bridge-ci-diagnostics-${{ github.run_id }}
          path: |
            bridge/build/windows-x64-debug/Testing/
            bridge/build/windows-x64-release/Testing/
          if-no-files-found: ignore
