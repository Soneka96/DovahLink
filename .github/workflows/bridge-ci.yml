name: bridge-ci

on:
  push:
    branches: [main]
    paths:
      - "bridge/**"
      - "protocol/**"
      - ".github/workflows/bridge-ci.yml"
  pull_request:
    paths:
      - "bridge/**"
      - "protocol/**"
      - ".github/workflows/bridge-ci.yml"
  workflow_dispatch:

concurrency:
  group: bridge-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    # Pinned toolchain and dependency baselines are recorded in bridge/README.md.
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}\vcpkg-binary-cache
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare vcpkg binary cache
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\vcpkg-binary-cache" | Out-Null

      - name: Install pinned CMake and Ninja
        run: |
          choco install cmake --version=4.4.2 --no-progress -y
          choco install ninja --version=1.13.2 --no-progress -y
          "$env:ChocolateyInstall\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path = "$env:ChocolateyInstall\bin;$env:Path"
          ninja --version

      - name: Set up the MSVC 2022 developer environment
        # Maintained stable release; no stable Node 24 replacement is available yet.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Check out vcpkg at the pinned builtin baseline
        run: |
          git clone https://github.com/microsoft/vcpkg.git "${{ runner.temp }}\vcpkg"
          git -C "${{ runner.temp }}\vcpkg" checkout 2f1d605400c8727cc00c15797aba796c88ccd523
          & "${{ runner.temp }}\vcpkg\bootstrap-vcpkg.bat" -disableMetrics

      - name: Restore vcpkg binary cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: ${{ runner.os }}-vcpkg-2f1d605400c8727cc00c15797aba796c88ccd523-${{ hashFiles('bridge/vcpkg.json', 'bridge/vcpkg-configuration.json') }}

      - name: Configure Debug
        working-directory: bridge
        env:
          VCPKG_ROOT: ${{ runner.temp }}\vcpkg
        run: cmake --preset windows-x64-debug

      - name: Build Debug
        working-directory: bridge
        run: cmake --build --preset windows-x64-debug

      - name: Test Debug
        working-directory: bridge
        run: ctest --preset windows-x64-debug

      - name: Configure Release
        working-directory: bridge
        env:
          VCPKG_ROOT: ${{ runner.temp }}\vcpkg
        run: cmake --preset windows-x64-release

      - name: Build Release
        working-directory: bridge
        run: cmake --build --preset windows-x64-release

      - name: Test Release
        working-directory: bridge
        run: ctest --test-dir build/windows-x64-release --output-on-failure

      - name: Upload bridge test diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: bridge-ci-diagnostics-${{ github.run_id }}
          path: |
            bridge/build/windows-x64-debug/Testing/
            bridge/build/windows-x64-release/Testing/
          if-no-files-found: ignore
