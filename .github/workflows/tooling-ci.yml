name: tooling-ci

on:
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "README.md"
      - "PRODUCT.md"
      - "ARCHITECTURE.md"
      - "ROADMAP.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - ".github/workflows/**"
      - ".vscode/**"
      - "ai/context/**"
      - "app/**"
      - "bridge/**"
      - "integration/**"
      - "protocol/**"
      - "sdk/**"
      - "tooling/**"
  pull_request:
    paths:
      - "AGENTS.md"
      - "README.md"
      - "PRODUCT.md"
      - "ARCHITECTURE.md"
      - "ROADMAP.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - ".github/workflows/**"
      - ".vscode/**"
      - "ai/context/**"
      - "app/**"
      - "bridge/**"
      - "integration/**"
      - "protocol/**"
      - "sdk/**"
      - "tooling/**"
  workflow_dispatch:

concurrency:
  group: tooling-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run repository checks
        run: python -m unittest discover -s tooling -p "test_*.py"
