name: App

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "protocol/**"
      - "sdk/dart/dovahlink_client/**"
      - ".github/workflows/app-ci.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: app-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: App Build & Test
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Restore Dart SDK dependencies
        working-directory: sdk/dart/dovahlink_client
        run: dart pub get

      - name: Generate Dart SDK sources
        working-directory: sdk/dart/dovahlink_client
        run: dart run build_runner build

      - name: Analyze Dart SDK
        working-directory: sdk/dart/dovahlink_client
        run: dart analyze

      - name: Test Dart SDK
        working-directory: sdk/dart/dovahlink_client
        run: dart test

      - name: Restore Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate Dart sources
        working-directory: app
        run: dart run build_runner build

      - name: Analyze Flutter client
        working-directory: app
        run: flutter analyze

      - name: Test Flutter client
        working-directory: app
        run: flutter test

      - name: Build Windows client
        working-directory: app
        run: flutter build windows --debug
