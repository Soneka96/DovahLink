name: App

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "bridge/**"
      - "protocol/**"
      - "sdk/dart/dovahlink_client/**"
      - "tooling/vcpkg-ports/**"
      - ".github/workflows/app-ci.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: app-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: App Build & Test
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      # Single source of truth for the pinned vcpkg tooling commit -- referenced by both the
      # checkout step and the tooling cache key below so they can never drift apart.
      VCPKG_BASELINE_COMMIT: 2f1d605400c8727cc00c15797aba796c88ccd523
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Set VCPKG_DEFAULT_BINARY_CACHE
        # A job-level env: value cannot use the runner context (it is not resolved until a runner
        # picks up the job's steps), so this is computed in a step instead.
        run: echo "VCPKG_DEFAULT_BINARY_CACHE=$env:RUNNER_TEMP\vcpkg-binary-cache" >> $env:GITHUB_ENV

      - name: Prepare vcpkg binary cache
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\vcpkg-binary-cache" | Out-Null

      - name: Install pinned CMake
        # windows-2022 ships an older CMake than the pinned version; a direct download of the
        # official release archive is faster and no less trustworthy than a Chocolatey install.
        run: |
          $cmakeVersion = "4.4.2"
          $cmakeArchive = "cmake-$cmakeVersion-windows-x86_64.zip"
          $cmakeArchiveSha256 = "e8139d85b3813bc38833142ae1940472e9a587e9b5d2718ac1804c60f4e57a64"
          $cmakeBin = "$env:RUNNER_TEMP\cmake\cmake-$cmakeVersion-windows-x86_64\bin"
          Invoke-WebRequest -Uri "https://github.com/Kitware/CMake/releases/download/v$cmakeVersion/$cmakeArchive" -OutFile "$env:RUNNER_TEMP\$cmakeArchive"
          $actualSha256 = (Get-FileHash -Path "$env:RUNNER_TEMP\$cmakeArchive" -Algorithm SHA256).Hash
          if ($actualSha256 -ne $cmakeArchiveSha256) {
            throw "CMake archive hash mismatch: expected $cmakeArchiveSha256, got $actualSha256."
          }
          Expand-Archive -Path "$env:RUNNER_TEMP\$cmakeArchive" -DestinationPath "$env:RUNNER_TEMP\cmake" -Force
          $cmakeBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path = "$cmakeBin;$env:Path"
          cmake --version

      - name: Set up the MSVC 2022 developer environment
        # Maintained stable release; no stable Node 24 replacement is available yet.
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Verify pinned Ninja is available in the build environment
        # Check after the MSVC setup because CMake runs with this step's resulting PATH.
        run: |
          $ninjaVersion = (ninja --version).Trim()
          if ($ninjaVersion -ne "1.13.2") {
            throw "Expected the windows-2022 image to provide Ninja 1.13.2, but found '$ninjaVersion'."
          }

      - name: Restore cached vcpkg tooling
        id: vcpkg-tooling-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}\vcpkg
          key: ${{ runner.os }}-vcpkg-tooling-${{ env.VCPKG_BASELINE_COMMIT }}

      - name: Check out vcpkg at the pinned builtin baseline
        if: steps.vcpkg-tooling-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/microsoft/vcpkg.git "${{ runner.temp }}\vcpkg"
          git -C "${{ runner.temp }}\vcpkg" checkout $env:VCPKG_BASELINE_COMMIT
          & "${{ runner.temp }}\vcpkg\bootstrap-vcpkg.bat" -disableMetrics

      - name: Restore vcpkg binary cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: ${{ runner.os }}-vcpkg-${{ env.VCPKG_BASELINE_COMMIT }}-${{ hashFiles('bridge/vcpkg.json', 'bridge/vcpkg-configuration.json', 'tooling/vcpkg-ports/**') }}

      - name: Configure bridge debug harness
        working-directory: bridge
        env:
          VCPKG_ROOT: ${{ runner.temp }}\vcpkg
        run: cmake --preset windows-x64-debug

      - name: Build bridge validation harness
        working-directory: bridge
        run: cmake --build --preset windows-x64-debug --target dovahlink_bridge_harness

      - name: Verify bridge harness path for Dart tests
        run: |
          $harness = "bridge\build\windows-x64-debug\dovahlink_bridge_harness.exe"
          if (-not (Test-Path -LiteralPath $harness -PathType Leaf)) {
            throw "Expected the Dart integration tests' bridge harness was not built: $harness"
          }

      - name: Restore Dart SDK dependencies
        working-directory: sdk/dart/dovahlink_client
        run: dart pub get

      - name: Generate Dart SDK sources
        working-directory: sdk/dart/dovahlink_client
        run: dart run build_runner build

      - name: Analyze Dart SDK
        working-directory: sdk/dart/dovahlink_client
        run: dart analyze

      - name: Test Dart SDK
        working-directory: sdk/dart/dovahlink_client
        run: dart test

      - name: Restore Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate Dart sources
        working-directory: app
        run: dart run build_runner build

      - name: Analyze Flutter client
        working-directory: app
        run: flutter analyze

      - name: Test Flutter client
        working-directory: app
        run: flutter test

      - name: Build Windows client
        working-directory: app
        run: flutter build windows --debug
