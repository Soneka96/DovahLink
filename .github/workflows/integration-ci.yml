name: Integration

on:
  push:
    branches: [main]
    paths:
      - "bridge/**"
      - "integration/**"
      - "protocol/**"
      - ".github/workflows/integration-ci.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: integration-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set VCPKG_DEFAULT_BINARY_CACHE
        # A job-level env: value cannot use the runner context (it is not resolved until a runner
        # picks up the job's steps), so this is computed in a step instead.
        run: echo "VCPKG_DEFAULT_BINARY_CACHE=$env:RUNNER_TEMP\vcpkg-binary-cache" >> $env:GITHUB_ENV

      - name: Prepare vcpkg binary cache
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\vcpkg-binary-cache" | Out-Null

      - name: Install pinned CMake and Ninja
        run: |
          choco install cmake --version=4.4.2 --no-progress -y
          choco install ninja --version=1.13.2 --no-progress -y
          "$env:ChocolateyInstall\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path = "$env:ChocolateyInstall\bin;$env:Path"
          ninja --version

      - name: Set up the MSVC 2022 developer environment
        # Maintained stable release; no stable Node 24 replacement is available yet.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Check out vcpkg at the pinned builtin baseline
        run: |
          git clone https://github.com/microsoft/vcpkg.git "${{ runner.temp }}\vcpkg"
          git -C "${{ runner.temp }}\vcpkg" checkout 2f1d605400c8727cc00c15797aba796c88ccd523
          & "${{ runner.temp }}\vcpkg\bootstrap-vcpkg.bat" -disableMetrics

      - name: Restore vcpkg binary cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: ${{ runner.os }}-vcpkg-2f1d605400c8727cc00c15797aba796c88ccd523-${{ hashFiles('bridge/vcpkg.json', 'bridge/vcpkg-configuration.json') }}

      - name: Configure bridge debug harness
        working-directory: bridge
        env:
          VCPKG_ROOT: ${{ runner.temp }}\vcpkg
        run: cmake --preset windows-x64-debug

      - name: Build bridge validation harness
        working-directory: bridge
        run: cmake --build --preset windows-x64-debug --target dovahlink_bridge_harness

      - name: Restore integration dependencies
        run: dotnet restore integration/DovahLinkValidation.sln

      - name: Run integration scenarios
        run: dotnet test integration/DovahLinkValidation.sln --configuration Release --no-restore --logger "trx;LogFileName=integration.trx" --results-directory integration/TestResults

      - name: Upload integration diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: integration-ci-diagnostics-${{ github.run_id }}
          path: integration/TestResults/
          if-no-files-found: ignore
