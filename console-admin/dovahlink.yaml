# ConsoleUtil Extended command definition for DovahLink Bridge's trust-administration console
# adapter. Optional: only takes effect if ConsoleUtil Extended is installed alongside DovahLink
# Bridge. Place this file in Data\SKSE\CustomConsole\ per ConsoleUtil Extended's documented config
# location. See ../README.md for the full install and dependency notes.

version: 1
name: dovahlink
script: DovahLinkAdmin
help: Use dovahlink help for full details.
subs:
  - name: list
    func: List
    help: List devices.
    args:
      - name: scope
        type: String
        required: false
        default: all
        help: "all, trust, or block."
  - name: help
    func: Help
    help: Show full help.
  - name: revoke
    func: Revoke
    help: Revoke a trusted device.
    args:
      - name: -id
        type: String
        required: true
        help: Five-digit device id.
  - name: block
    func: Block
    help: Block a device.
    args:
      - name: -id
        type: String
        required: true
        help: Five-digit device id.
  - name: unblock
    func: Unblock
    help: Unblock a device.
    args:
      - name: -id
        type: String
        required: true
        help: Five-digit device id.
  - name: forget
    func: Forget
    help: Forget a device.
    args:
      - name: -id
        type: String
        required: true
        help: Five-digit device id.
  # dovahlink reset-trust / dovahlink reset / dovahlink confirm-reset -confirm <code> route to three
  # distinct native functions (ResetTrust, Reset, ConfirmReset -- see DovahLinkAdmin.psc), not one
  # branching function the way "list"'s scope argument above does. The previous two-word reset
  # command and duplicate reset entries were invalid under ConsoleUtil Extended's unique one-word
  # subcommand rules. Keep each subcommand unique so the complete command file loads.
  - name: reset-trust
    func: ResetTrust
    help: Revoke all trusted devices.
  - name: reset
    func: Reset
    help: Start Factory Reset confirmation.
  - name: confirm-reset
    func: ConfirmReset
    help: Complete Factory Reset with code.
    args:
      - name: -confirm
        type: String
        required: true
        help: Six-digit confirmation code.
