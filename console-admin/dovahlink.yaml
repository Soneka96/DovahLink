# ConsoleUtil Extended command definition for DovahLink Bridge's trust-administration console
# adapter. Optional: only takes effect if ConsoleUtil Extended is installed alongside DovahLink
# Bridge. Place this file in Data\SKSE\CustomConsole\ per ConsoleUtil Extended's documented config
# location. See ../README.md for the full install and dependency notes.

version: 1
name: dovahlink
script: DovahLinkAdmin
subs:
  - name: list
    func: List
    help: Lists every currently trusted client.
  - name: revoke
    func: Revoke
    help: Revokes the trusted client with the given administration-only id.
    args:
      - name: id
        type: String
        alias: id
        required: true
        help: The five-digit administration-only id shown by "dovahlink list" (never the client's real, long identity or its credential).
  - name: reset
    func: Reset
    help: Resets all persistent trust. Every currently trusted client must re-pair afterward.
  - name: block
    func: Block
    help: Blocks the known device with the given administration-only id, regardless of its current state.
    args:
      - name: id
        type: String
        alias: id
        required: true
        help: The five-digit administration-only id shown by "dovahlink list" or "dovahlink devices" (never the client's real, long identity or its credential).
  - name: unblock
    func: Unblock
    help: Unblocks the known device with the given administration-only id, returning it to unpaired.
    args:
      - name: id
        type: String
        alias: id
        required: true
        help: The five-digit administration-only id shown by "dovahlink list" or "dovahlink devices" (never the client's real, long identity or its credential).
  - name: forget
    func: Forget
    help: Forgets the known device with the given administration-only id, deleting its record entirely. Only eligible from revoked or unpaired.
    args:
      - name: id
        type: String
        alias: id
        required: true
        help: The five-digit administration-only id shown by "dovahlink list" or "dovahlink devices" (never the client's real, long identity or its credential).
  - name: devices
    func: Devices
    help: Lists every known device with its current state, sorted oldest-to-newest by creation time.
  - name: blocklist
    func: Blocked
    help: Lists only known devices currently in the blocked state.
